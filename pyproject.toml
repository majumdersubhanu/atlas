[project]
name = "atlas-risk"
version = "0.5.0"
description = "Reproducible bank capital stress and synthetic interbank contagion research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "networkx>=3.4,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.8,<1"]
notebook = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.10,<6",
    "jupyter-server>=2.17,<3",
]

[tool.uv]
required-version = ">=0.13.6"
default-groups = ["dev", "notebook"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "scripts/", "docs/", "notebooks/", "data/", "frontend/",
    "README.md", "CONTRIBUTING.md", "THIRD_PARTY_NOTICES.md",
    "pyproject.toml", "uv.lock", ".python-version",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[project.scripts]
atlas-demo = "atlas.cli:main"
atlas-research = "atlas.research:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
